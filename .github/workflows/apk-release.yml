name: Build APK and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download apktool and uber-apk-signer
        run: |
          mkdir -p tools
          curl -fsSL -o tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -fsSL -o tools/uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Rebuild APK
        run: |
          mkdir -p dist
          java -jar tools/apktool.jar b . -o dist/PhoenixDrone-built.apk

      - name: Sign APK
        run: |
          java -jar tools/uber-apk-signer.jar \
            --allowResign \
            --overwrite \
            -a dist/PhoenixDrone-built.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixDrone-4K-english
          path: |
            dist/PhoenixDrone-built.apk
            dist/PhoenixDrone-built-aligned-debugSigned.apk
          if-no-files-found: error

      - name: Publish GitHub Release from tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/PhoenixDrone-built.apk \
              dist/PhoenixDrone-built-aligned-debugSigned.apk \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/PhoenixDrone-built.apk \
              dist/PhoenixDrone-built-aligned-debugSigned.apk \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
